name: Tests

on:
  push:
    branches: [ master, main, rust ]
  pull_request:
    branches: [ master, main ]

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Nix
      uses: cachix/install-nix-action@v27
      with:
        nix_path: nixpkgs=channel:nixos-unstable
        extra_nix_config: |
          experimental-features = nix-command flakes

    - name: Build
      run: nix develop --command cargo build -p ebpfence-daemon -p ebpfence-client

    - name: Run unit tests
      run: nix develop --command cargo test -p ebpfence-daemon -p ebpfence-client

  integration-tests:
    name: Integration Tests
    runs-on: self-hosted
    needs: unit-tests

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Nix
      uses: cachix/install-nix-action@v27
      with:
        nix_path: nixpkgs=channel:nixos-unstable
        extra_nix_config: |
          experimental-features = nix-command flakes

    - name: Check kernel support
      run: |
        echo "Kernel version: $(uname -r)"

        if [ ! -f /sys/kernel/btf/vmlinux ]; then
          echo "✗ BTF not available"
          exit 1
        fi
        echo "✓ BTF is available"

        if [ ! -f /sys/kernel/security/lsm ]; then
          echo "✗ LSM info not available"
          exit 1
        fi
        LSM_LIST=$(cat /sys/kernel/security/lsm)
        echo "LSM list: $LSM_LIST"
        if ! echo "$LSM_LIST" | grep -q "bpf"; then
          echo "✗ LSM BPF is NOT enabled"
          exit 1
        fi
        echo "✓ LSM BPF is enabled"

    - name: Run integration tests
      run: |
        nix develop .#integration --command \
          sudo -E cargo test -p ebpfence-daemon --features integration -- --test-threads=1
