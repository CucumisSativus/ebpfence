name: Tests

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  runs-on: self-hosted
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25.5'

    - name: Install dependencies
      run: go mod download

    - name: Install build tools
      run: |
        sudo apt-get update
        sudo apt-get install -y clang llvm libbpf-dev protobuf-compiler

    - name: Install protoc Go plugins
      run: |
        go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
        go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest

    - name: Generate protobuf code
      run: go generate ./proto/

    - name: Generate eBPF bindings
      run: go generate ./daemon/

    - name: Build binaries
      run: |
        CGO_ENABLED=0 go build -o ebpfence-daemon ./cmd/daemon/
        CGO_ENABLED=0 go build -o ebpfence-client ./cmd/client/
        echo "✓ Both binaries built successfully"

    - name: Run unit tests
      run: |
        # Note: Integration tests excluded (require -tags=integration)
        go test -v -race -coverprofile=coverage.out ./...

    - name: Upload coverage
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.out
        flags: unittests
      continue-on-error: true

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25.5'

    - name: Install dependencies
      run: go mod download

    - name: Install build tools
      run: |
        sudo apt-get update
        sudo apt-get install -y clang llvm libbpf-dev protobuf-compiler

    - name: Install protoc Go plugins
      run: |
        go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
        go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest

    - name: Generate protobuf code
      run: go generate ./proto/

    - name: Generate eBPF bindings
      run: go generate ./daemon/

    - name: Check kernel support
      id: check_kernel
      run: |
        echo "Checking kernel version..."
        uname -r

        echo "Checking for BTF support..."
        if [ -f /sys/kernel/btf/vmlinux ]; then
          echo "✓ BTF is available"
          echo "btf_available=true" >> $GITHUB_OUTPUT
        else
          echo "✗ BTF not available"
          echo "btf_available=false" >> $GITHUB_OUTPUT
        fi

        echo "Checking LSM BPF support..."
        if [ -f /sys/kernel/security/lsm ]; then
          LSM_LIST=$(cat /sys/kernel/security/lsm)
          echo "LSM list: $LSM_LIST"
          if echo "$LSM_LIST" | grep -q "bpf"; then
            echo "✓ LSM BPF is enabled"
            echo "lsm_bpf_available=true" >> $GITHUB_OUTPUT
          else
            echo "✗ LSM BPF is NOT enabled (bpf not in LSM list)"
            echo "lsm_bpf_available=false" >> $GITHUB_OUTPUT
          fi
        else
          echo "✗ LSM info not available"
          echo "lsm_bpf_available=false" >> $GITHUB_OUTPUT
        fi

        echo "Checking if running as root..."
        if [ "$(id -u)" = "0" ]; then
          echo "✓ Running as root"
        else
          echo "✗ Not running as root"
        fi

    - name: Run integration tests
      if: steps.check_kernel.outputs.btf_available == 'true'
      run: |
        echo "Running integration tests with eBPF support..."
        sudo -E go test -v -tags=integration -timeout=5m ./daemon/
      continue-on-error: true

    - name: Integration test summary
      if: steps.check_kernel.outputs.btf_available == 'true'
      run: |
        if [ "${{ steps.check_kernel.outputs.lsm_bpf_available }}" = "true" ]; then
          echo "✓ Integration tests ran with full LSM BPF support"
        else
          echo "⚠️  Integration tests ran but LSM BPF is not enabled"
          echo "   Some tests may have been skipped or failed due to missing LSM BPF support"
          echo "   This is expected on standard GitHub runners"
          echo "   Full functionality requires kernel boot parameter: lsm=...,bpf"
        fi

    - name: Skip integration tests
      if: steps.check_kernel.outputs.btf_available != 'true'
      run: |
        echo "⚠️  Skipping integration tests - kernel does not support eBPF (BTF not available)"
        echo "Integration tests require kernel 5.7+ with BTF support"
        echo "This is expected on older GitHub runner kernels"
