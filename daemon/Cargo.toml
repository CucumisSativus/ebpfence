[package]
name = "ebpfence-daemon"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "ebpfence-daemon"
path = "src/main.rs"

[dependencies]
libbpf-rs = "0.24"
tokio = { version = "1", features = ["full"] }
tonic = "0.12"
prost = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
globset = "0.4"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio-util = "0.7"
tokio-stream = { version = "0.1", features = ["net"] }
anyhow = "1"

[features]
integration = []

[dev-dependencies]
tempfile = "3"

[build-dependencies]
libbpf-cargo = "0.24"
tonic-build = "0.12"
